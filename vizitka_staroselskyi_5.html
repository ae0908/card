<style>
  :root{
    --red:#F03136;
    --red-dark:#c41e23;
    --red-tint:#fdeeee;
    --cream:#ffffff;
    --page:#ffffff;
    --ink:#1B1B1B;
    --steel:#8c8178;
    --line:rgba(27,27,27,0.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--page);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--cream);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(43,36,32,0.10);
    position:relative;
  }
  .stripe{
    height:8px;
    width:100%;
    background:var(--red);
  }
  .content{
    padding:36px 32px 28px;
  }
  .brandrow{
    margin-bottom:26px;
    text-align:center;
  }
  .logo{
    width:170px;
    height:auto;
    display:inline-block;
  }

  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:29px;
    line-height:1.2;
    color:var(--ink);
    letter-spacing:0.01em;
    margin-bottom:8px;
  }
  .slogan{
    font-size:12.5px;
    color:var(--red);
    font-weight:600;
    letter-spacing:0.01em;
    line-height:1.4;
    margin-bottom:20px;
  }
  .divider{
    height:1px;
    background:var(--line);
    margin:24px 0 20px;
  }
  .rows{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
  }
  .icon{
    width:30px;
    height:30px;
    border:1px solid var(--line);
    border-radius:3px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{width:15px;height:15px;stroke:var(--red);}
  .icon.wa{background:#25D366;border:none;}
  .icon.wa svg{width:14px;height:14px;stroke:none;}
  .icon.vb{background:#7360F2;border:none;}
  .icon.vb svg{width:14px;height:14px;stroke:none;}
  .rowtext{
    font-size:14px;
    color:var(--ink);
    font-weight:500;
    word-break:break-all;
  }
  .qrsection{
    background:var(--red-tint);
    padding:24px 32px 30px;
    display:flex;
    align-items:center;
    gap:18px;
  }
  #qr{
    background:#fff;
    padding:8px;
    border-radius:3px;
    flex-shrink:0;
    line-height:0;
  }
  .qrtext p{
    font-size:12.5px;
    color:var(--steel);
    line-height:1.5;
  }
  .qrtext p.title{
    font-family:'Anton',sans-serif;
    font-size:14px;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-bottom:4px;
    font-weight:600;
  }
  .savebtn{
    display:block;
    width:100%;
    padding:14px;
    background:var(--red);
    color:#ffffff;
    text-align:center;
    font-family:'Anton',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border:none;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .savebtn:hover{background:var(--red-dark);}
  .savebtn:active{transform:scale(0.99);}
</style>
</head>
